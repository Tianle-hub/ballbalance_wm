[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-dreamer"
version = "0.1.0"
description = "PyTorch DreamerV1 agent for an analytical Gymnasium ball-board balancing environment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["ball_rssm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
