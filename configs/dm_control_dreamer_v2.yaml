# Dreamer V2 DM-Control training preset.
# Run with:
#   .venv-dm-control/bin/python scripts/train_dm_control_dreamer.py --config configs/dm_control_dreamer_v2.yaml

# DM-Control task. Change these three fields to reuse the preset on another task.
domain: cartpole
task: swingup
obs_type: state          # "state" is fast and stable; use "pixel" for rendered camera observations.
run_dir: runs/dmc_cartpole_swingup_v2_yaml
dataset: null            # Optional replay .npz. Leave null to collect random seed replay online.

# Dreamer variant. V2 uses straight-through categorical RSSM stochastic latents.
dreamer_version: v2

# Replay and online interaction.
seed_episodes: 20        # Random episodes collected before learning starts.
buffer_episodes: 2000    # Replay capacity measured in full episodes.
max_episode_steps: 200   # Per-episode horizon used by collector and replay windows.
online_iterations: 100   # Outer loop count: train updates, validate, collect, checkpoint.
train_steps: 100         # Gradient updates per online iteration.
collect_episodes: 5      # Fresh policy episodes appended after each iteration.
val_fraction: 0.1        # Episode fraction held out for validation metrics.

# Batch geometry.
seq_len: 50              # RSSM training sequence length; observations use seq_len + 1 frames.
batch_size: 128          # Replay sequences per world-model update.
imagination_horizon: 15  # Dreamer actor/critic imagined rollout length.

# DM-Control wrapper and rendering. Camera fields matter only for obs_type: pixel.
action_repeat: 1         # Repeat each selected action this many env steps.
height: 64               # Pixel render height; changing this may require CNN decoder changes.
width: 64                # Pixel render width; keep 64 for the default conv architecture.
camera_id: null          # null uses task defaults; cartpole pixel defaults to fixed camera 0.
camera_fovy: null        # null uses task defaults; cartpole pixel defaults to wider fixed FOV 70.
mujoco_gl: null          # Use "egl" on headless machines for pixel rendering.

# Optimizers.
world_lr: 0.0003         # World model Adam learning rate.
actor_lr: 0.00008        # Actor Adam learning rate.
critic_lr: 0.00008       # Critic Adam learning rate.
grad_clip: 100.0         # Global gradient norm clipping for each optimizer group.

# RSSM and MLP sizes.
deter_dim: 128           # Deterministic recurrent hidden state size.
stoch_dim: 16            # Number of categorical stochastic variables in V2.
discrete_classes: 32     # Categories per stochastic variable; latent size is stoch_dim * classes.
embed_dim: 64            # Observation encoder embedding size.
hidden_dim: 128          # Shared RSSM/head hidden layer width.
rssm_ensemble: 5         # Dynamics ensemble size; stabilizes harder V2 and pixel runs.
layer_norm: true         # LayerNorm improves categorical RSSM stability.

# Pixel CNN architecture. These defaults are shaped for 64x64 observations.
cnn_depth: 48
encoder_kernels: [4, 4, 4, 4]
decoder_kernels: [5, 5, 6, 6]

# Prediction heads and reconstruction losses.
decoder_dist: normal     # "normal" is Gaussian NLL; "mse" uses squared error.
reward_head_dist: normal # Reward prediction loss distribution.
value_head_dist: normal  # Critic value loss distribution.
reward_transform: identity # Optional reward target transform: identity/sign/tanh/symlog.
reward_head_layers: 4
continuation_head_layers: 4
reward_loss_weight: 1.0
continuation_loss_weight: 1.0

# KL regularization.
beta_kl: 1.0             # Overall KL loss scale.
free_nats: 1.0           # Legacy free-nats value kept for compatibility.
kl_free: 0.0             # Free KL threshold used by the current KL helper.
kl_balance: 0.8          # Balance between representation and dynamics KL terms.
kl_forward: false        # false means reverse KL direction by default.
kl_free_avg: true        # Apply free KL after averaging rather than per element.

# Actor/critic behavior learning.
discount: 0.99           # Environment reward discount.
lambda: 0.95             # TD(lambda) return mixing parameter.
actor_gradient: auto     # auto resolves to dynamics gradients for continuous actions.
actor_entropy_scale: 0.001 # Entropy bonus scale in imagined actor objective.
exploration_mode: auto   # auto resolves to policy-entropy sampling for V2.
exploration_noise: 0.3   # Used if exploration_mode is forced to "noise".
exploration_decay: 1.0   # Multiplicative decay per online iteration.
min_exploration_noise: 0.0
target_tau: 0.01         # Critic target-network soft update rate.

# Reproducibility and resume behavior.
seed: 0
device: cuda             # Falls back to CPU if CUDA is unavailable.
resume: true             # Resume run_dir/checkpoints/latest.pt and replay/latest.npz if present.
resume_from: null        # Optional explicit checkpoint path.
